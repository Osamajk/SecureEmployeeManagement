name: CI

# Run on every push and PR to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install the .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. CI: restore dependencies
      - name: Restore
        run: dotnet restore

      # 4. CI: build (warnings-as-info; don't fail on the known SQLite advisory yet)
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # 5. CI: run the automated tests (auth, RBAC, validation)
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=detailed"

      # 6. SCA: fail the build if any dependency has a known vulnerability
      - name: Dependency scan (SCA)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::warning::Vulnerable dependencies found"
          fi
          